version: "2"
sql:
  - engine: "postgresql"
    queries: "./internal/db/queries"
    schema: "./internal/db/migrations"
    gen:
      go:
        package: "sqlc"
        out: "./internal/db"
        sql_package: "pgx/v5"
        emit_json_tags: true
        json_tags_case_style: "camel"
        emit_interface: true
        emit_empty_slices: true
        overrides:
           - column: "category_tree_view.tree"
             go_type:
              import: "simple_store_go/myTypes"
              type: "ListCategoriesTreeRowDTO"
              slice: true
