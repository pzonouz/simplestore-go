user root;
worker_processes auto;
pid /run/nginx.pid;
error_log /var/log/nginx/error.log;
include /etc/nginx/modules-enabled/*.conf;

events {
    worker_connections 768;
}

http {
    sendfile on;
    tcp_nopush on;
    types_hash_max_size 2048;

    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    access_log /var/log/nginx/access.log;
    gzip on;

    # ─────────────────────────────────────────────────────────────
    # HTTP → HTTPS redirect (covers BOTH hostnames)
    # ─────────────────────────────────────────────────────────────
    server {
        listen 80;
        listen [::]:80;
        server_name nanochemshop.ir www.nanochemshop.ir;
        return 301 https://$host$request_uri;
    }

    # ─────────────────────────────────────────────────────────────
    # HTTPS main server
    # ─────────────────────────────────────────────────────────────
    server {
    listen 127.0.0.1:80;
    server_name localhost;

    location /backend/ {
        proxy_pass http://127.0.0.1:8000/;   # change to your backend's port
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        }
    }
    server {
        listen 443 ssl http2;          # keep this form: nginx 1.22.1 (http2 directive needs ≥1.25.1)
        listen [::]:443 ssl http2;

        server_name nanochemshop.ir www.nanochemshop.ir;

        client_max_body_size 1G;

        ssl_certificate     /etc/letsencrypt/live/nanochemshop.ir/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/nanochemshop.ir/privkey.pem;
        include /etc/letsencrypt/options-ssl-nginx.conf;
        ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy strict-origin-when-cross-origin always;

        # Static uploads
        location /uploads/ {
            alias /root/projects/simplestore-go/uploads/;
            expires off;
        }

        location /backend/ {
            proxy_pass http://127.0.0.1:8000/;
            proxy_http_version 1.1;
            proxy_set_header Host              $host;
            proxy_set_header X-Real-IP         $remote_addr;
            proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Forwarded-Host  $host;
        }

        # SvelteKit frontend
        location / {
            proxy_pass http://127.0.0.1:3000;
            #proxy_http_version 1.1;
            proxy_set_header Upgrade           $http_upgrade;
            proxy_set_header Connection        'upgrade';
            proxy_set_header Host              $host;
            proxy_set_header X-Real-IP         $remote_addr;
            proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_cache_bypass                 $http_upgrade;
        }
    }
}
